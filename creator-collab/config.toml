[app]
name = "ZippoWorkz"
release = "BETA_1_6_4"
timezone = "Europe/Berlin"

[operations]
meta_api_status = "PROVEN_LIVE_2026_09_21"
fiverr_identity_status = "OWNER_REPORTED_VERIFIED"
fiverr_gig_status = "ACTIVE_PUBLIC_VERIFIED_WRITE_READY_2026_09_21"

[runtime]
host = "192.168.188.131"
port = 4180
database = "data/review_dashboard.db"
offline_output = "output/offline"
health_path = "/api/health"

[scheduler]
interval_minutes = 5
morning_hour = 5
morning_minute = 30
dispatch_live = true

[watchdog]
interval_minutes = 5
maximum_restarts = 3
window_minutes = 30
backoff_seconds = 30

[supervisor]
poll_seconds = 30

[publishing]
adapter = "meta-graph"
live_enabled = true

[capabilities]
standalone_runtime = true
per_user_autostart_fallback = true
offline_snapshot = true
official_instagram_publish_adapter = true
official_instagram_publish = true
live_external_actions = true
hard_dependency_on_gpt6 = false
